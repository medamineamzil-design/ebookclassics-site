name: BookClassics library design
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble catalogue and library design
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, zipfile, hashlib, re
          source = Path('.')
          output = Path('_site')
          output.mkdir(exist_ok=True)
          for p in source.iterdir():
              if p.name in {'.git', '.github', '_site', 'bookclassics-design-assets.zip'}:
                  continue
              if p.is_dir():
                  shutil.copytree(p, output / p.name, dirs_exist_ok=True)
              else:
                  shutil.copy2(p, output / p.name)
          with zipfile.ZipFile('bookclassics-design-assets.zip') as archive:
              for item in archive.infolist():
                  path = Path(item.filename)
                  if path.is_absolute() or '..' in path.parts or not item.filename.startswith('assets/library/'):
                      raise ValueError('Unexpected design asset path')
              archive.extractall(output)
          enhancement = r'''(function(){
          var css='.library-original-home{position:relative}.library-image-copy{position:absolute;inset:0;pointer-events:none;z-index:5;font-family:Georgia,serif;color:#14283b}.library-image-copy span{position:absolute;display:block;text-align:center;line-height:1.15;text-shadow:0 1px #fff8}.image-free{top:1.3%;left:3%;padding:5px 14px;border-radius:20px;background:#e5c98b;color:#14283b;font:700 12px Arial,sans-serif;letter-spacing:.12em}.image-hero-title{top:10.5%;left:24%;right:24%;font-weight:700;font-size:clamp(19px,2.4vw,34px)}.image-hero-lead{top:17.2%;left:28%;right:28%;font-size:clamp(11px,1.2vw,17px)}.image-explore,.image-all{top:29.1%;padding:8px 12px;border-radius:5px;background:#fff8ea;color:#14283b;font:700 clamp(10px,1.1vw,15px) Arial,sans-serif}.image-explore{left:15%;width:25%}.image-all{right:15%;width:25%}.image-shelf{top:46.2%;left:30%;right:30%;font-weight:700;font-size:clamp(16px,1.8vw,25px)}.library-original-caption{position:absolute;left:0;right:0;bottom:1.5%;font:600 clamp(10px,1.1vw,16px)/1.1 Georgia,serif;text-align:center;color:#14283b;background:#fff8eae8;padding:4px 2px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.library-original-home a:focus,.library-original-home a:focus-visible,button:focus,button:focus-visible,.library-account-tools button:focus,.library-account-tools button:focus-visible{outline:none!important;box-shadow:none!important}@media(max-width:600px){.library-image-copy .image-hero-title{top:25%;font-size:20px}.library-image-copy .image-hero-lead{top:31.5%;font-size:10px}.library-image-copy .image-explore,.library-image-copy .image-all{top:37%;font-size:9px;padding:6px 3px}.library-image-copy .image-shelf{top:56%;font-size:13px}.library-image-copy .image-free{font-size:9px;padding:3px 8px}.library-original-caption{font-size:9px}}';
          var labels={fr:['GRATUIT','Entrez dans votre bibliothèque','Des histoires à découvrir, des livres à feuilleter.','Explorer les genres','Voir tous les livres','À découvrir aujourd’hui'],en:['FREE','Enter your library','Stories to discover. Books to explore.','Explore genres','See all books','Discover today'],es:['GRATIS','Entra en tu biblioteca','Historias para descubrir. Libros para explorar.','Explorar géneros','Ver todos los libros','Descubre hoy'],pt:['GRÁTIS','Entre na sua biblioteca','Histórias para descobrir. Livros para explorar.','Explorar gêneros','Ver todos os livros','Descubra hoje'],de:['KOSTENLOS','Betreten Sie Ihre Bibliothek','Geschichten entdecken. Bücher erkunden.','Genres erkunden','Alle Bücher ansehen','Heute entdecken'],it:['GRATIS','Entra nella tua biblioteca','Storie da scoprire. Libri da esplorare.','Esplora i generi','Vedi tutti i libri','Scopri oggi'],ar:['مجانًا','ادخل إلى مكتبتك','قصص لاكتشافها. كتب لاستكشافها.','استكشف الأنواع','عرض كل الكتب','اكتشف اليوم'],ru:['БЕСПЛАТНО','Войдите в свою библиотеку','Истории для открытия. Книги для чтения.','Все жанры','Все книги','Откройте сегодня'],zh:['免费','进入您的图书馆','发现故事，探索书籍。','探索分类','查看全部图书','今日推荐'],hi:['मुफ़्त','अपनी लाइब्रेरी में आएँ','खोजने के लिए कहानियाँ। पढ़ने के लिए किताबें।','शैलियाँ देखें','सभी किताबें देखें','आज खोजें'],ko:['무료','도서관에 오신 것을 환영합니다','발견할 이야기와 책을 만나보세요.','장르 둘러보기','모든 책 보기','오늘의 추천'],tr:['ÜCRETSİZ','Kütüphanenize hoş geldiniz','Keşfedilecek hikâyeler, okunacak kitaplar.','Türleri keşfet','Tüm kitapları gör','Bugün keşfet']};
          function refresh(){var room=document.querySelector('.library-original-home');if(!room)return;var style=document.getElementById('home-overlay-style');if(!style){style=document.createElement('style');style.id='home-overlay-style';style.textContent=css;document.head.appendChild(style)}var layer=room.querySelector('.library-image-copy');if(!layer){layer=document.createElement('div');layer.className='library-image-copy';layer.setAttribute('aria-hidden','true');room.appendChild(layer)}var select=document.getElementById('uiLangSelect');var code=((select&&select.value)||document.documentElement.lang||'en').toLowerCase().split('-')[0];var t=labels[code]||labels.en;layer.innerHTML='<span class="image-free">'+t[0]+'</span><span class="image-hero-title">'+t[1]+'</span><span class="image-hero-lead">'+t[2]+'</span><span class="image-explore">'+t[3]+'</span><span class="image-all">'+t[4]+'</span><span class="image-shelf">'+t[5]+'</span>';room.querySelectorAll('.library-daily-book').forEach(function(a){var cap=a.querySelector('.library-original-caption');var title=(a.getAttribute('aria-label')||'').split(' — ')[0];if(!cap){cap=document.createElement('span');cap.className='library-original-caption';a.appendChild(cap)}cap.textContent=title});if(select&&!select.dataset.homeOverlayBound){select.dataset.homeOverlayBound='1';select.addEventListener('change',function(){setTimeout(refresh,80)})}}
          refresh();document.addEventListener('change',function(e){if(e.target&&e.target.id==='uiLangSelect')refresh()});setInterval(refresh,1200);
          })();'''
          shutil.copy2(output / 'assets/library/library.js', output / 'assets/library/library-runtime.js')
          (output / 'assets/library/home-enhancements.js').write_text(enhancement)
          version = hashlib.sha256(Path('bookclassics-design-assets.zip').read_bytes() + enhancement.encode() + b'library-runtime').hexdigest()[:12]
          css = '<link rel="stylesheet" href="/assets/library/library.css?v=' + version + '">\n<link rel="stylesheet" href="/assets/library/cohesion.css?v=' + version + '">' 
          root = output / 'index.html'
          html = root.read_text()
          html = re.sub(r'<link[^>]+href="/assets/library/library.css[^" ]*"[^>]*>', '', html)
          html = re.sub(r'<script src="/assets/library/[^" ]+"></script>', '', html)
          html = html.replace('</head>', css + '\n</head>', 1)
          scripts = ''.join('<script src="/assets/library/' + name + '?v=' + version + '"></script>\n' for name in ['library-runtime.js', 'reader-pages.js', 'cohesion.js', 'home-enhancements.js'])
          html = html.replace('</body>', scripts + '</body>', 1)
          html = html.replace('content="#2D49EC"', 'content="#14283B"')
          root.write_text(html)
          pages = list((output / 'books').glob('*/index.html')) + [output / 'books/index.html']
          for page in pages:
              if not page.exists():
                  continue
              html = page.read_text()
              html = re.sub(r'<link[^>]+href="/assets/library/library.css[^" ]*"[^>]*>', '', html)
              html = html.replace('</head>', css + '\n</head>', 1)
              html = html.replace('<body>', '<body class="standalone-library">')
              page.write_text(html)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy BookClassics
        id: deployment
        uses: actions/deploy-pages@v4
