name: BookClassics library design
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble catalogue and library design
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, zipfile, hashlib, re
          source = Path('.')
          output = Path('_site')
          output.mkdir(exist_ok=True)
          for p in source.iterdir():
              if p.name in {'.git', '.github', '_site', 'bookclassics-design-assets.zip'}:
                  continue
              if p.is_dir():
                  shutil.copytree(p, output / p.name, dirs_exist_ok=True)
              else:
                  shutil.copy2(p, output / p.name)
          with zipfile.ZipFile('bookclassics-design-assets.zip') as archive:
              for item in archive.infolist():
                  path = Path(item.filename)
                  if path.is_absolute() or '..' in path.parts or not item.filename.startswith('assets/library/'):
                      raise ValueError('Unexpected design asset path')
              archive.extractall(output)
          enhancement = r'''(function(){
          var css=':focus,:focus-visible{outline:none!important;box-shadow:none!important}body:not([data-library-view=home]) header.site .catbar{display:none!important}body[data-library-view=home] header.site{display:contents!important}body[data-library-view=home] .library-account-tools{position:absolute!important;top:1.2%;right:2%;z-index:30;background:transparent!important}body:not([data-library-view=home]) .library-account-tools{position:absolute!important;top:7px;right:18px;z-index:30;padding:0!important;background:transparent!important}.library-original-home .image-free{display:none!important}.library-original-home .library-daily-book img{height:100%!important;object-fit:cover!important}.library-original-home .library-daily-book{height:29%!important}.library-summary{padding-top:22px!important;padding-bottom:32px!important}.library-summary p{margin-top:8px!important;font-weight:600}';
          var labels={fr:['La bibliothèque en quelques chiffres','GRATUIT · Des classiques à lire, à écouter et à retrouver chaque jour.'],en:['Your library at a glance','FREE · Classic stories to read, listen to and rediscover every day.'],es:['Tu biblioteca de un vistazo','GRATIS · Clásicos para leer, escuchar y redescubrir cada día.'],de:['Ihre Bibliothek auf einen Blick','KOSTENLOS · Klassiker zum Lesen, Hören und täglichen Wiederentdecken.'],it:['La tua biblioteca in sintesi','GRATIS · Classici da leggere, ascoltare e riscoprire ogni giorno.'],pt:['A sua biblioteca em números','GRÁTIS · Clássicos para ler, ouvir e redescobrir todos os dias.'],ar:['لمحة عن مكتبتك','مجانًا · كلاسيكيات للقراءة والاستماع وإعادة الاكتشاف كل يوم.']};
          function apply(){var select=document.getElementById('uiLangSelect');var code=((select&&select.value)||document.documentElement.lang||'en').toLowerCase().split('-')[0];var t=labels[code]||labels.en;var s=document.querySelector('.library-summary');if(s){var h=s.querySelector('h2');if(h)h.textContent=t[0];var p=s.querySelector('p');if(p)p.textContent=t[1]}document.querySelectorAll('.library-original-caption,.library-open-label,.image-free').forEach(function(n){n.remove()});var body=document.body;if(body&&!body.getAttribute('data-library-view'))body.setAttribute('data-library-view',location.pathname==='/index.html'||location.pathname==='/'?'home':'inner')}
          var style=document.createElement('style');style.textContent=css;document.head.appendChild(style);apply();document.addEventListener('change',function(e){if(e.target&&e.target.id==='uiLangSelect')setTimeout(apply,80)});setInterval(apply,1200);
          })();'''
          (output / 'assets/library/home-enhancements.js').write_text(enhancement)
          version = hashlib.sha256(Path('bookclassics-design-assets.zip').read_bytes() + enhancement.encode() + b'final-ui-v1').hexdigest()[:12]
          csslinks = '<link rel="stylesheet" href="/assets/library/library.css?v=' + version + '">' + chr(10) + '<link rel="stylesheet" href="/assets/library/cohesion.css?v=' + version + '">'
          root = output / 'index.html'
          html = root.read_text()
          html = re.sub(r'<link[^>]+href="/assets/library/library.css[^" ]*"[^>]*>', '', html)
          html = re.sub(r'<script src="/assets/library/[^" ]+"></script>', '', html)
          html = html.replace('<header', csslinks + chr(10) + '<header', 1)
          scripts = ''.join('<script src="/assets/library/' + name + '?v=' + version + '"></script>' + chr(10) for name in ['library.js','reader-pages.js','cohesion.js','home-enhancements.js'])
          html += chr(10) + scripts
          html = html.replace('content="#2D49EC"', 'content="#14283B"')
          root.write_text(html)
          pages = list((output / 'books').glob('*/index.html')) + [output / 'books/index.html']
          for page in pages:
              if not page.exists():
                  continue
              html = page.read_text()
              html = re.sub(r'<link[^>]+href="/assets/library/library.css[^" ]*"[^>]*>', '', html)
              html = html.replace('</head>', csslinks + chr(10) + '</head>', 1)
              html = html.replace('<body>', '<body class="standalone-library">')
              account = "<div class='library-account-tools'><select aria-label='Site language'><option>English</option><option>Français</option><option>Español</option><option>Português</option><option>Deutsch</option><option>العربية</option></select><a class='standalone-auth' href='/#signin'>Sign In</a><a class='standalone-auth primary' href='/#signup'>Sign Up</a></div>"
              html = html.replace('</header>', account + '</header>', 1)
              html = html.replace('</head>', '<style>header.top .wrap{align-items:center}header.top .library-account-tools{display:flex;align-items:center;gap:8px;margin-left:auto}header.top .library-account-tools select,header.top .standalone-auth{font:600 .84rem Arial,sans-serif;padding:7px 10px;border-radius:999px;border:1px solid #d9d4c4;background:#fff;color:#2a2015;text-decoration:none}header.top .standalone-auth.primary{background:#2d4be0;border-color:#2d4be0;color:#fff}</style></head>', 1)
              page.write_text(html)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy BookClassics
        id: deployment
        uses: actions/deploy-pages@v4
