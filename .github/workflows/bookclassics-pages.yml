e(){return select?select.value:saved}\nfunction tr(key){var d=translations[key]||{};return d[code()]||d.EN||key}\nif(!main){\n header.innerHTML=\'<div class="wrap topbar"><a class="logo" href="/">BookClassics</a><nav class="main"><a class="navlink" id="nav-library" href="/#library"></a></nav><form class="search" action="/" role="search"><input id="searchInput" type="search" name="q"></form><div class="library-account-tools"><div class="lang-switch"><select id="uiLangSelect"></select></div><div class="topbar-auth"><a class="btn btn-secondary btn-auth" id="btnAuthSignIn" href="/#signin"></a><a class="btn btn-primary btn-auth" id="btnAuthSignUp" href="/#signup"></a></div></div></div>\';\n select=document.getElementById(\'uiLangSelect\');languages.forEach(function(l){var o=document.createElement(\'option\');o.value=l.code;o.textContent=l.label;select.append(o)});select.value=languages.some(function(l){return l.code===saved})?saved:\'EN\';\n select.addEventListener(\'change\',function(){saved=select.value;try{localStorage.setItem(\'ebc_ui_lang\',saved)}catch(e){}localize()});\n}else{\n var bar=header.querySelector(\'.topbar\'),tools=document.querySelector(\'.library-account-tools\');if(tools)bar.append(tools);\n [\'nav-home\',\'nav-genres\',\'nav-catalog\'].forEach(function(id){var n=document.getElementById(id);if(n)n.hidden=true});\n var oldSearch=bar.querySelector(\'.search\'),form=document.createElement(\'form\');form.className=\'search\';form.setAttribute(\'role\',\'search\');while(oldSearch.firstChild)form.append(oldSearch.firstChild);oldSearch.replaceWith(form);\n form.addEventListener(\'submit\',function(e){e.preventDefault();state.page=1;showView(\'catalog\');document.getElementById(\'searchInput\').focus()});\n document.getElementById(\'searchInput\').addEventListener(\'input\',function(){state.cat=null;state.formats=new Set();state.languages=new Set();state.page=1},true);\n var normalize=function(s){return String(s||\'\').normalize(\'NFD\').replace(/[\\u0300-\\u036f]/g,\'\').toLowerCase().replace(/[’\']/g,\' \')};\n matchesQuery=function(book,q){if(!q)return true;var aliases={\'treasure-island\':\'L’île au trésor\',\'alice-s-adventures-in-wonderland\':\'Alice au pays des merveilles\',\'pride-and-prejudice\':\'Orgueil et Préjugés\'};var hay=normalize(book.title+\' \'+book.author+\' \'+catLabel(book.cat)+\' \'+(aliases[hostedSlug(book)]||\'\'));return normalize(q).split(/\\s+/).filter(Boolean).every(function(part){return hay.includes(part)})};\n document.addEventListener(\'click\',function(e){if(e.target.closest(\'.original-catalog,.original-explore,.library-genre-card,.library-browse,.library-catalog-head>a\')){document.getElementById(\'searchInput\').value=\'\';state.cat=null;state.formats=new Set();state.languages=new Set();state.page=1}},true);\n var oldCatalog=renderCatalog;renderCatalog=function(){oldCatalog();var count=document.getElementById(\'resultCount\');if(state.uiLang===\'FR\'&&count.textContent===\'1 titres\')count.textContent=\'1 titre\'};\n var count=document.getElementById(\'resultCount\');count.setAttribute(\'role\',\'status\');count.setAttribute(\'aria-live\',\'polite\');\n var priorLang=applyUILang;applyUILang=function(c,o){priorLang(c,o);localize();requestAnimationFrame(fitTitle)};\n var query=new URLSearchParams(location.search).get(\'q\');if(query){document.getElementById(\'searchInput\').value=query;state.cat=null;state.page=1;showView(\'catalog\')}\n}\nvar search=header.querySelector(\'.search\'),submit=document.createElement(\'button\');submit.type=\'submit\';submit.innerHTML=\'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/></svg>\';search.append(submit);\nvar originalNodes=new Map();\nfunction localize(){\n var lang=code();var input=document.getElementById(\'searchInput\');input.placeholder=tr(\'search.placeholder\');input.setAttribute(\'aria-label\',tr(\'search.aria\'));submit.setAttribute(\'aria-label\',tr(\'search.aria\'));select.setAttribute(\'aria-label\',tr(\'lang.switcherAria\'));\n var nav=document.getElementById(\'nav-library\');nav.removeAttribute(\'data-i18n\');nav.textContent=lang===\'FR\'?\'Mes livres\':tr(\'nav.library\');\n if(!main){\n  document.getElementById(\'btnAuthSignIn\').textContent=tr(\'account.signInBtn\');document.getElementById(\'btnAuthSignUp\').textContent=tr(\'account.signUpBtn\');\n  var meta=languages.find(function(l){return l.code===lang});document.documentElement.lang=meta?meta.iso:\'en\';\n  [[\'bcRead\',\'bd2.readOnline\'],[\'bcListen\',\'bd2.listen\'],[\'bcDl\',\'bd2.download\']].forEach(function(pair){var n=document.getElementById(pair[0]);if(n)n.textContent=tr(pair[1])});\n  document.querySelectorAll(\'.bcReadLink\').forEach(function(n){n.textContent=tr(\'bd.readFree\')+\' →\'});\n  document.querySelectorAll(\'main h2\').forEach(function(n){if(!originalNodes.has(n))originalNodes.set(n,n.textContent);var keys={\'Editions\':\'bd2.editions\',\'About the book\':\'bd.aboutBook\'};var k=keys[originalNodes.get(n)];if(k)n.textContent=tr(k)});\n  document.querySelectorAll(\'h1,.ed>span,.grid strong,.grid b\').forEach(function(n){n.setAttribute(\'translate\',\'no\')});\n }\n requestAnimationFrame(fitTitle);\n}\nfunction fitTitle(){\n document.querySelectorAll(\'.image-hero-title,.image-hero-lead\').forEach(function(el){\n  var width=el.clientWidth;if(!width)return;var max=(el.classList.contains(\'image-hero-title\')?2.4:1.4)*window.innerWidth/100;\n  el.style.fontSize=max+\'px\';var range=document.createRange();range.selectNodeContents(el);var content=range.getBoundingClientRect().width;if(content>width-6)el.style.fontSize=Math.max(5,max*(width-6)/content)+\'px\';\n });\n}\nlocalize();window.addEventListener(\'resize\',fitTitle);if(document.fonts)document.fonts.ready.then(fitTitle);\nif(main){var title=document.querySelector(\'.image-hero-title\');title.setAttribute(\'role\',\'heading\');title.setAttribute(\'aria-level\',\'1\');var room=document.querySelector(\'.library-original-home\');new MutationObserver(function(){requestAnimationFrame(fitTitle)}).observe(room.querySelector(\'.library-image-copy\'),{childList:true,subtree:true,characterData:true})}\n})();\n'
          enhancement += '\n' + navigation_fixes
          (output / 'assets/library/navigation-fixes.js').write_text(navigation_fixes)
          (output / 'assets/library/home-enhancements.js').write_text(enhancement)
          version = hashlib.sha256(Path('bookclassics-design-assets.zip').read_bytes() + enhancement.encode() + b'fragment-safe-v2').hexdigest()[:12]
          css = '<link rel="stylesheet" href="/assets/library/library.css?v=' + version + '">\n<link rel="stylesheet" href="/assets/library/cohesion.css?v=' + version + '">' 
          root = output / 'index.html'
          html = root.read_text()
          # Connect the previously generated covers to entries still using text-only faces.
          missing_covers = {'b88': 'the-book-of-common-prayer', 'b94': 'a-christmas-carol', 'b111': 'macbeth', 'b112': 'othello', 'b113': 'king-lear', 'b115': 'the-tempest', 'b123': 'the-red-and-the-black', 'b124': 'father-goriot', 'b125': 'bel-ami', 'b127': 'grimm-s-fairy-tales', 'b128': 'andersen-s-fairy-tales', 'b129': 'the-arabian-nights', 'b130': 'the-prophet', 'b131': 'tao-te-ching', 'b132': 'the-rubaiyat-of-omar-khayyam'}
          for book_id, slug in missing_covers.items():
              assert (output / 'covers' / (slug + '.jpg')).is_file(), 'Missing cover: ' + slug
              marker = "{id:'" + book_id + "',"
              assert html.count(marker) == 1, 'Ambiguous catalogue entry: ' + book_id
              html = html.replace(marker, marker + ' coverImg:"/covers/' + slug + '.jpg",', 1)
          # Assign reviewed cover art before rendering catalogue and book details.
          generated_covers = json.loads(Path('generated-covers.json').read_text())
          for slug in generated_covers.values():
              assert (output / 'covers' / (slug + '.jpg')).is_file(), slug
          books_start = html.index('const BOOKS =')
          books_end = html.index('\n];', books_start) + 3
          assignment = '\nconst GENERATED_COVERS = ' + json.dumps(generated_covers) + ';\nBOOKS.forEach(book=>{if(GENERATED_COVERS[book.id])book.coverImg="/covers/"+GENERATED_COVERS[book.id]+".jpg";});\n'
          html = html[:books_end] + assignment + html[books_end:]
          old_source = "img.src = BOOK_EXTRA[hostedSlug(book)]"
          assert old_source in html, 'Cover source selection changed'
          html = html.replace(old_source, "img.src = book.coverImg.startsWith('/covers/') ? book.coverImg : BOOK_EXTRA[hostedSlug(book)]", 1)
          html = re.sub(r'<link[^>]+href="/assets/library/library.css[^" ]*"[^>]*>', '', html)
          html = re.sub(r'<script src="/assets/library/[^" ]+"></script>', '', html)
          html = html.replace('<header', css + '\n<header', 1)
          scripts = ''.join('<script src="/assets/library/' + name + '?v=' + version + '"></script>\n' for name in ['library.js', 'reader-pages.js', 'cohesion.js', 'home-enhancements.js'])
          # The source is an HTML fragment; its closing body tags belong to book templates.
          html += '\n' + scripts
          html = html.replace('content="#2D49EC"', 'content="#14283B"')
          root.write_text(html)
          pages = list((output / 'books').glob('*/index.html')) + [output / 'books/index.html'] + [output / name for name in ['about.html', 'contact.html', 'privacy.html']]
          for page in pages:
              if not page.exists():
                  continue
              html = page.read_text()
              if page.parent.name == 'a-christmas-carol':
                  html = re.sub(r'<div class="cover text">.*?</div>', '<img class="cover" src="/covers/a-christmas-carol.jpg" width="1024" height="1536" alt="A Christmas Carol — Charles Dickens" loading="eager">', html, count=1, flags=re.S)
              html = re.sub(r'<link[^>]+href="/assets/library/library.css[^" ]*"[^>]*>', '', html)
              html = html.replace('</head>', css + '\n</head>', 1)
              html = html.replace('<body>', '<body class="standalone-library">')
              html = html.replace('</body>', '<script src="/assets/library/navigation-fixes.js?v=' + version + '"></script>\n</body>')
              page.write_text(html)
          PY
