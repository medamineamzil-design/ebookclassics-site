name: BookClassics library design
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble catalogue and library design
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, zipfile, hashlib, re
          source = Path('.')
          output = Path('_site')
          output.mkdir(exist_ok=True)
          for p in source.iterdir():
              if p.name in {'.git', '.github', '_site', 'bookclassics-design-assets.zip'}:
                  continue
              if p.is_dir():
                  shutil.copytree(p, output / p.name, dirs_exist_ok=True)
              else:
                  shutil.copy2(p, output / p.name)
          with zipfile.ZipFile('bookclassics-design-assets.zip') as archive:
              for item in archive.infolist():
                  path = Path(item.filename)
                  if path.is_absolute() or '..' in path.parts or not item.filename.startswith('assets/library/'):
                      raise ValueError('Unexpected design asset path')
              archive.extractall(output)
          enhancement = r'''(function(){
          var css=".library-original-home{position:relative}.library-image-copy{position:absolute;inset:0;pointer-events:none;z-index:5;font-family:Georgia,serif;color:#14283b}.library-image-copy span{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;box-sizing:border-box}.image-free{top:18%;left:43%;width:14%;height:4%;background:#f3e8d3;color:#705126;font:700 clamp(8px,1vw,15px) Arial,sans-serif}.image-hero-title{top:23.3%;left:30.4%;width:39.2%;height:5.5%;background:#f3e8d3;font-weight:700;font-size:clamp(12px,2.5vw,39px)}.image-hero-lead{top:28.7%;left:30.4%;width:39.2%;height:3.7%;background:#f3e8d3;font-size:clamp(7px,1.4vw,22px)}.image-explore,.image-all{top:33.2%;height:5.3%;border-radius:5px;font-size:clamp(7px,1.15vw,18px)}.image-explore{left:33.4%;width:16.5%;background:#14283b;color:#fff8ea}.image-all{left:51.3%;width:15.6%;background:#f3e8d3;color:#14283b}.image-shelf{top:56.4%;left:41%;width:18%;height:3.7%;background:#573719;color:#ffe1a5;font-size:clamp(9px,1.65vw,25px)}.library-original-home .library-art-link.original-home,.library-original-home .library-art-link.original-genres,.library-original-home .library-art-link.original-library{z-index:7;display:flex;align-items:center;justify-content:center;background:#192b3e;color:#fff3dc;font:clamp(6px,1vw,16px)/1.2 Georgia,serif;text-align:center}.library-original-caption{position:absolute;left:0;right:0;top:8%;padding:6px 3px;background:#fff8eaf5;color:#14283b;font:600 clamp(8px,1.2vw,19px)/1.15 Georgia,serif;text-align:center;overflow-wrap:anywhere}.library-open-label{position:absolute;bottom:0;left:12%;right:12%;height:12%;display:flex;align-items:center;justify-content:center;background:#f3e8d3;color:#14283b;font:clamp(7px,.9vw,14px)/1 Georgia,serif;border-radius:4px}.library-account-tools{min-height:0!important;padding:6px 20px!important;gap:10px!important;align-items:center!important}.library-account-tools button,.library-account-tools select{min-height:30px!important;padding:5px 10px!important;margin:0!important}.library-account-tools .lang-switch{margin:0!important}a:focus:not(:focus-visible),button:focus:not(:focus-visible){outline:none!important;box-shadow:none!important}.library-original-home a:focus:not(:focus-visible){outline:none!important;box-shadow:none!important}@media(max-width:600px){.library-image-copy,.library-original-links,.library-daily-books{bottom:auto;aspect-ratio:3/2}.library-original-caption{padding:2px;font-size:7px}.library-account-tools{justify-content:center!important;gap:5px!important}.library-account-tools button{font-size:12px!important}}";
          var labels={fr:['GRATUIT','Entrez dans votre bibliothèque','Des histoires à découvrir, des livres à feuilleter.','Explorer les genres','Voir tous les livres','À découvrir aujourd’hui'],en:['FREE','Enter your library','Stories to discover. Books to explore.','Explore genres','See all books','Discover today'],es:['GRATIS','Entra en tu biblioteca','Historias para descubrir. Libros para explorar.','Explorar géneros','Ver todos los libros','Descubre hoy'],pt:['GRÁTIS','Entre na sua biblioteca','Histórias para descobrir. Livros para explorar.','Explorar gêneros','Ver todos os livros','Descubra hoje'],de:['KOSTENLOS','Betreten Sie Ihre Bibliothek','Geschichten entdecken. Bücher erkunden.','Genres erkunden','Alle Bücher ansehen','Heute entdecken'],it:['GRATIS','Entra nella tua biblioteca','Storie da scoprire. Libri da esplorare.','Esplora i generi','Vedi tutti i libri','Scopri oggi'],ar:['مجانًا','ادخل إلى مكتبتك','قصص لاكتشافها. كتب لاستكشافها.','استكشف الأنواع','عرض كل الكتب','اكتشف اليوم'],ru:['БЕСПЛАТНО','Войдите в свою библиотеку','Истории для открытия. Книги для чтения.','Все жанры','Все книги','Откройте сегодня'],zh:['免费','进入您的图书馆','发现故事，探索书籍。','探索分类','查看全部图书','今日推荐'],hi:['मुफ़्त','अपनी लाइब्रेरी में आएँ','खोजने के लिए कहानियाँ। पढ़ने के लिए किताबें।','शैलियाँ देखें','सभी किताबें देखें','आज खोजें'],ko:['무료','도서관에 오신 것을 환영합니다','발견할 이야기와 책을 만나보세요.','장르 둘러보기','모든 책 보기','오늘의 추천'],tr:['ÜCRETSİZ','Kütüphanenize hoş geldiniz','Keşfedilecek hikâyeler, okunacak kitaplar.','Türleri keşfet','Tüm kitapları gör','Bugün keşfet']};
          function refresh(){var room=document.querySelector('.library-original-home');if(!room)return;var style=document.getElementById('home-overlay-style');if(!style){style=document.createElement('style');style.id='home-overlay-style';style.textContent=css;document.head.appendChild(style)}var layer=room.querySelector('.library-image-copy');if(!layer){layer=document.createElement('div');layer.className='library-image-copy';layer.setAttribute('aria-hidden','true');room.appendChild(layer)}var select=document.getElementById('uiLangSelect');var code=((select&&select.value)||document.documentElement.lang||'en').toLowerCase().split('-')[0];var t=labels[code]||labels.en;layer.innerHTML='<span class="image-free">'+t[0]+'</span><span class="image-hero-title">'+t[1]+'</span><span class="image-hero-lead">'+t[2]+'</span><span class="image-explore">'+t[3]+'</span><span class="image-all">'+t[4]+'</span><span class="image-shelf">'+t[5]+'</span>';room.querySelectorAll('.library-daily-book').forEach(function(a){var cap=a.querySelector('.library-original-caption');var title=(a.getAttribute('aria-label')||'').split(' — ')[0];if(!cap){cap=document.createElement('span');cap.className='library-original-caption';a.appendChild(cap)}cap.textContent=title;cap.setAttribute('translate','no');a.setAttribute('translate','no');var open=a.querySelector('.library-open-label');if(!open){open=document.createElement('span');open.className='library-open-label';a.appendChild(open)}open.textContent=code==='fr'?'Ouvrir':code==='es'?'Abrir':code==='de'?'Öffnen':code==='it'?'Apri':code==='pt'?'Abrir':code==='ar'?'افتح':'Open'});room.querySelector('.original-home').textContent=code==='fr'?'Accueil':code==='es'?'Inicio':code==='de'?'Start':code==='ar'?'الرئيسية':'Home';room.querySelector('.original-genres').textContent=code==='fr'?'Tous les genres':t[3];room.querySelector('.original-library').textContent=code==='fr'?'Mes livres':code==='es'?'Mis libros':code==='de'?'Meine Bücher':code==='it'?'I miei libri':code==='pt'?'Meus livros':code==='ar'?'كتبي':'My books';if(select&&!select.dataset.homeOverlayBound){select.dataset.homeOverlayBound='1';select.addEventListener('change',function(){setTimeout(refresh,80)})}}
          refresh();document.addEventListener('change',function(e){if(e.target&&e.target.id==='uiLangSelect')refresh()});setInterval(refresh,1200);
          })();'''
          (output / 'assets/library/home-enhancements.js').write_text(enhancement)
          version = hashlib.sha256(Path('bookclassics-design-assets.zip').read_bytes() + enhancement.encode() + b'fragment-safe-v3').hexdigest()[:12]
          css = '<link rel="stylesheet" href="/assets/library/library.css?v=' + version + '">\n<link rel="stylesheet" href="/assets/library/cohesion.css?v=' + version + '">' 
          root = output / 'index.html'
          html = root.read_text()
          html = re.sub(r'<link[^>]+href="/assets/library/library.css[^" ]*"[^>]*>', '', html)
          html = re.sub(r'<script src="/assets/library/[^" ]+"></script>', '', html)
          html = html.replace('<header', css + '\n<header', 1)
          scripts = ''.join('<script src="/assets/library/' + name + '?v=' + version + '"></script>\n' for name in ['library.js', 'reader-pages.js', 'cohesion.js', 'home-enhancements.js'])
          # Source fragment: closing body tags inside JS belong to exported books.
          html += '\n' + scripts
          html = html.replace('content="#2D49EC"', 'content="#14283B"')
          root.write_text(html)
          pages = list((output / 'books').glob('*/index.html')) + [output / 'books/index.html']
          for page in pages:
              if not page.exists():
                  continue
              html = page.read_text()
              html = re.sub(r'<link[^>]+href="/assets/library/library.css[^" ]*"[^>]*>', '', html)
              html = html.replace('</head>', css + '\n</head>', 1)
              html = html.replace('<body>', '<body class="standalone-library">')
              page.write_text(html)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy BookClassics
        id: deployment
        uses: actions/deploy-pages@v4
