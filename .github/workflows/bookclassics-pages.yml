          library = library.replace('Only the daily book faces may change.', 'The five original book faces never change.')
          library_file.write_text(library)
          enhancement = r'''(function(){
          var css="\n.library-original-home{position:relative}.library-image-copy{position:absolute;inset:0;pointer-events:none;z-index:5;font-family:Georgia,serif;color:#14283b}.library-image-copy span{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;box-sizing:border-box}\n.image-free{top:18%;left:43%;width:14%;height:4%;background:#f3e8d3;color:#705126;font:700 clamp(8px,1vw,15px) Arial,sans-serif}\n.image-hero-title{top:23.3%;left:30.4%;width:39.2%;height:5.5%;background:#f3e8d3;font-weight:700;font-size:clamp(12px,2.5vw,39px)}\n.image-hero-lead{top:28.7%;left:30.4%;width:39.2%;height:3.7%;background:#f3e8d3;font-size:clamp(7px,1.4vw,22px)}\n.image-explore,.image-all{top:33.2%;height:5.3%;border-radius:5px;font-size:clamp(7px,1.15vw,18px)}.image-explore{left:33.4%;width:16.5%;background:#14283b;color:#fff8ea}.image-all{left:51.3%;width:15.6%;background:#f3e8d3;color:#14283b}\n.image-shelf{top:56.4%;left:41%;width:18%;height:3.7%;background:#573719;color:#ffe1a5;font-size:clamp(9px,1.65vw,25px)}\n.library-original-home .library-art-link.original-home,.library-original-home .library-art-link.original-genres,.library-original-home .library-art-link.original-library{z-index:7;display:flex;align-items:center;justify-content:center;background:#192b3e;color:#fff3dc;font:clamp(6px,1vw,16px)/1.2 Georgia,serif;text-align:center}\n.library-original-caption{display:none!important}.library-open-label{display:none!important}\n.library-account-tools{min-height:0!important;padding:6px 20px!important;gap:10px!important;align-items:center!important}.library-account-tools button,.library-account-tools select{min-height:30px!important;padding:5px 10px!important;margin:0!important}.library-account-tools .lang-switch{margin:0!important}\na:focus:not(:focus-visible),button:focus:not(:focus-visible){outline:none!important;box-shadow:none!important}.library-original-home a:focus:not(:focus-visible){outline:none!important;box-shad