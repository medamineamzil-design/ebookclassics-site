name: BookClassics library design
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble catalogue and library design
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, zipfile, hashlib, re, json
          source = Path('.')
          output = Path('_site')
          output.mkdir(exist_ok=True)
          for p in source.iterdir():
              if p.name in {'.git', '.github', '_site', 'bookclassics-design-assets.zip'} or p.name.startswith('bookclassics-generated-covers-'):
                  continue
              if p.is_dir():
                  shutil.copytree(p, output / p.name, dirs_exist_ok=True)
              else:
                  shutil.copy2(p, output / p.name)
          with zipfile.ZipFile('bookclassics-design-assets.zip') as archive:
              for item in archive.infolist():
                  path = Path(item.filename)
                  if path.is_absolute() or '..' in path.parts or not item.filename.startswith('assets/library/'):
                      raise ValueError('Unexpected design asset path')
              archive.extractall(output)
          for bundle in sorted(source.glob('bookclassics-generated-covers-*.zip')):
              with zipfile.ZipFile(bundle) as archive:
                  for item in archive.infolist():
                      path = Path(item.filename)
                      if path.is_absolute() or '..' in path.parts or not item.filename.startswith('covers/') or path.suffix != '.jpg':
                          raise ValueError('Unexpected generated cover path')
                  archive.extractall(output)
          localized_copy = json.loads("{\"en\":[\"FREE\",\"Enter your library\",\"Stories to discover. Books to explore.\",\"Explore genres\",\"See all books\",\"Discover today\",\"Your library at a glance\",\"FREE · Classics to read, listen to and rediscover every day.\",\"Home\",\"My books\",\"Open\",\"Open the book\"],\"fr\":[\"GRATUIT\",\"Entrez dans votre bibliothèque\",\"Des histoires à découvrir, des livres à feuilleter.\",\"Explorer les genres\",\"Voir tous les livres\",\"À découvrir aujourd’hui\",\"Votre bibliothèque en un coup d’œil\",\"GRATUIT · Des classiques à lire, à écouter et à retrouver chaque jour.\",\"Accueil\",\"Mes livres\",\"Ouvrir\",\"Ouvrir le livre\"],\"es\":[\"GRATIS\",\"Entra en tu biblioteca\",\"Historias por descubrir. Libros para explorar.\",\"Explorar géneros\",\"Ver todos los libros\",\"Descubre hoy\",\"Tu biblioteca de un vistazo\",\"GRATIS · Clásicos para leer, escuchar y redescubrir cada día.\",\"Inicio\",\"Mis libros\",\"Abrir\",\"Abrir el libro\"],\"pt\":[\"GRÁTIS\",\"Entre na sua biblioteca\",\"Histórias para descobrir. Livros para folhear.\",\"Explorar géneros\",\"Ver todos os livros\",\"Descubra hoje\",\"A sua biblioteca num relance\",\"GRÁTIS · Clássicos para ler, ouvir e redescobrir todos os dias.\",\"Início\",\"Os meus livros\",\"Abrir\",\"Abrir o livro\"],\"pb\":[\"GRÁTIS\",\"Entre na sua biblioteca\",\"Histórias para descobrir. Livros para explorar.\",\"Explorar gêneros\",\"Ver todos os livros\",\"Descubra hoje\",\"Sua biblioteca em um relance\",\"GRÁTIS · Clássicos para ler, ouvir e redescobrir todos os dias.\",\"Início\",\"Meus livros\",\"Abrir\",\"Abrir o livro\"],\"ar\":[\"مجانًا\",\"ادخل إلى مكتبتك\",\"حكايات لاكتشافها وكتب لتتصفحها.\",\"استكشف الأنواع\",\"عرض كل الكتب\",\"اكتشف اليوم\",\"مكتبتك في لمحة\",\"مجانًا · كلاسيكيات للقراءة والاستماع وإعادة الاكتشاف كل يوم.\",\"الرئيسية\",\"كتبي\",\"افتح\",\"افتح الكتاب\"],\"zh\":[\"免费\",\"欢迎来到您的图书馆\",\"发现精彩故事，探索经典好书。\",\"按类型浏览\",\"查看全部图书\",\"今日推荐\",\"图书馆一览\",\"免费 · 每天阅读、聆听并重温经典。\",\"首页\",\"我的书籍\",\"打开\",\"打开图书\"],\"ja\":[\"無料\",\"図書館へようこそ\",\"物語との出会い、名作とのひとときを。\",\"ジャンルから探す\",\"すべての本を見る\",\"今日のおすすめ\",\"ライブラリの概要\",\"無料 · 毎日、読んで聴ける名作に出会えます。\",\"ホーム\",\"マイブック\",\"開く\",\"本を開く\"],\"ru\":[\"БЕСПЛАТНО\",\"Добро пожаловать в библиотеку\",\"Откройте для себя истории и книги.\",\"По жанрам\",\"Все книги\",\"Сегодня рекомендуем\",\"Ваша библиотека вкратце\",\"Бесплатно · Классика для чтения и прослушивания каждый день.\",\"Главная\",\"Мои книги\",\"Открыть\",\"Открыть книгу\"],\"de\":[\"KOSTENLOS\",\"Willkommen in Ihrer Bibliothek\",\"Geschichten entdecken und Bücher durchstöbern.\",\"Nach Genre stöbern\",\"Alle Bücher ansehen\",\"Heute entdecken\",\"Ihre Bibliothek auf einen Blick\",\"Kostenlos · Klassiker zum Lesen und Hören, jeden Tag neu.\",\"Startseite\",\"Meine Bücher\",\"Öffnen\",\"Buch öffnen\"],\"sq\":[\"FALAS\",\"Mirë se vini në bibliotekën tuaj\",\"Zbuloni histori dhe shfletoni libra.\",\"Shfleto sipas zhanrit\",\"Shiko të gjithë librat\",\"Zbuloni sot\",\"Biblioteka juaj me një vështrim\",\"Falas · Klasikë për t’u lexuar e dëgjuar çdo ditë.\",\"Kreu\",\"Librat e mi\",\"Hap\",\"Hap librin\"],\"eu\":[\"DOAN\",\"Ongi etorri zure liburutegira\",\"Aurkitu istorioak eta arakatu liburuak.\",\"Generoka arakatu\",\"Liburu guztiak ikusi\",\"Gaurko gomendioak\",\"Zure liburutegia begirada batean\",\"Doan · Egunero irakurri eta entzuteko klasikoak.\",\"Hasiera\",\"Nire liburuak\",\"Ireki\",\"Ireki liburua\"],\"ca\":[\"GRATUÏT\",\"Entra a la teva biblioteca\",\"Històries per descobrir i llibres per fullejar.\",\"Explora per gènere\",\"Veure tots els llibres\",\"Descobreix avui\",\"La teva biblioteca d’un cop d’ull\",\"Gratuït · Clàssics per llegir, escoltar i redescobrir cada dia.\",\"Inici\",\"Els meus llibres\",\"Obre\",\"Obre el llibre\"],\"hi\":[\"मुफ़्त\",\"अपनी लाइब्रेरी में आपका स्वागत है\",\"नई कहानियाँ खोजें, किताबें पढ़ें।\",\"शैली के अनुसार देखें\",\"सभी किताबें देखें\",\"आज की पसंद\",\"आपकी लाइब्रेरी एक नज़र में\",\"मुफ़्त · हर दिन पढ़ने और सुनने के लिए क्लासिक रचनाएँ।\",\"होम\",\"मेरी किताबें\",\"खोलें\",\"किताब खोलें\"],\"it\":[\"GRATIS\",\"Entra nella tua biblioteca\",\"Storie da scoprire e libri da sfogliare.\",\"Esplora per genere\",\"Vedi tutti i libri\",\"Scopri oggi\",\"La tua biblioteca in breve\",\"Gratis · Classici da leggere e ascoltare, da riscoprire ogni giorno.\",\"Home\",\"I miei libri\",\"Apri\",\"Apri il libro\"],\"ko\":[\"무료\",\"도서관에 오신 것을 환영합니다\",\"새로운 이야기를 만나고 책을 둘러보세요.\",\"장르별 둘러보기\",\"모든 책 보기\",\"오늘의 추천\",\"내 도서관 한눈에 보기\",\"무료 · 매일 읽고 들으며 다시 만나는 고전.\",\"홈\",\"내 책\",\"열기\",\"책 열기\"],\"ro\":[\"GRATUIT\",\"Bine ai venit în biblioteca ta\",\"Povești de descoperit și cărți de răsfoit.\",\"Răsfoiește după gen\",\"Vezi toate cărțile\",\"Descoperă azi\",\"Biblioteca ta dintr-o privire\",\"Gratuit · Clasici de citit și ascultat, în fiecare zi.\",\"Acasă\",\"Cărțile mele\",\"Deschide\",\"Deschide cartea\"],\"sr\":[\"БЕСПЛАТНО\",\"Добро дошли у своју библиотеку\",\"Откријте приче и прелистајте књиге.\",\"Прегледај по жанру\",\"Погледај све књиге\",\"Откријте данас\",\"Ваша библиотека на једном месту\",\"Бесплатно · Класици за читање и слушање сваког дана.\",\"Почетна\",\"Моје књиге\",\"Отвори\",\"Отвори књигу\"],\"sv\":[\"GRATIS\",\"Välkommen till ditt bibliotek\",\"Berättelser att upptäcka och böcker att bläddra i.\",\"Utforska efter genre\",\"Se alla böcker\",\"Upptäck i dag\",\"Ditt bibliotek i korthet\",\"Gratis · Klassiker att läsa och lyssna på, varje dag.\",\"Hem\",\"Mina böcker\",\"Öppna\",\"Öppna boken\"],\"zt\":[\"免費\",\"歡迎來到你的圖書館\",\"發現精彩故事，探索經典好書。\",\"按類別瀏覽\",\"查看所有書籍\",\"今日推薦\",\"圖書館一覽\",\"免費 · 每天閱讀、聆聽並重溫經典。\",\"首頁\",\"我的書籍\",\"開啟\",\"開啟書籍\"],\"tr\":[\"ÜCRETSİZ\",\"Kütüphanenize hoş geldiniz\",\"Keşfedilecek hikâyeler, göz atılacak kitaplar.\",\"Türe göre göz at\",\"Tüm kitapları gör\",\"Bugünü keşfet\",\"Kütüphaneniz bir bakışta\",\"Ücretsiz · Her gün okuyup dinleyebileceğiniz klasikler.\",\"Ana Sayfa\",\"Kitaplarım\",\"Aç\",\"Kitabı aç\"],\"uk\":[\"БЕЗКОШТОВНО\",\"Лас