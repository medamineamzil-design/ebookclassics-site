name: BookClassics library design
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the current catalogue with the library design
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, zipfile, hashlib, re
          source=Path('.')
          output=Path('_site')
          output.mkdir(exist_ok=True)
          for p in source.iterdir():
            if p.name.startswith('.') or p.name in {'_site','bookclassics-design-assets.zip'}: continue
            if p.is_dir(): shutil.copytree(p,output/p.name,dirs_exist_ok=True)
            else: shutil.copy2(p,output/p.name)
          with zipfile.ZipFile('bookclassics-design-assets.zip') as archive:
            for item in archive.infolist():
              path=Path(item.filename)
              if path.is_absolute() or '..' in path.parts or not item.filename.startswith('assets/library/'): raise ValueError('Unexpected asset path')
            archive.extractall(output)
          enhancement=r'''(function(){
            var css='.library-image-room{position:relative}.library-image-copy{position:absolute;inset:0;pointer-events:none;z-index:3;font-family:Georgia,serif;color:#14283b}.library-image-copy span{position:absolute;display:block;text-align:center;line-height:1.15;text-shadow:0 1px #fff8}.image-free{top:1.3%;left:3%;padding:5px 14px;border-radius:20px;background:#e5c98b;color:#14283b;font:700 12px Arial,sans-serif;letter-spacing:.12em}.image-hero-title{top:10.5%;left:24%;right:24%;font-weight:700;font-size:clamp(19px,2.4vw,34px)}.image-hero-lead{top:17.2%;left:28%;right:28%;font-size:clamp(11px,1.2vw,17px)}.image-explore,.image-all{top:29.1%;padding:8px 12px;border-radius:5px;background:#fff8ea;color:#14283b;font:700 clamp(10px,1.1vw,15px) Arial,sans-serif}.image-explore{left:15%;width:25%}.image-all{right:15%;width:25%}.image-shelf{top:46.2%;left:30%;right:30%;font-weight:700;font-size:clamp(16px,1.8vw,25px)}.library-original-caption{position:absolute;left:0;right:0;bottom:1.5%;font:600 clamp(10px,1.1vw,16px)/1.1 Georgia,serif;text-align:center;color:#14283b;background:#fff8eae8;padding:4px 2px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.library-image-room a:focus,.library-image-room a:focus-visible,.library-account-tools button:focus,.library-account-tools button:focus-visible{outline:none!important;box-shadow:none!important}@media(max-width:600px){.library-image-copy .image-hero-title{top:25%;font-size:20px}.library-image-copy .image-hero-lead{top:31.5%;font-size:10px}.library-image-copy .image-explore,.library-image-copy .image-all{top:37%;font-size:9px;padding:6px 3px}.library-image-copy .image-shelf{top:56%;font-size:13px}.library-image-copy .image-free{font-size:9px;padding:3px 8px}.library-original-caption{font-size:9px}}';
            function refresh(){var room=document.querySelector('.library-image-room');if(!room)return;var st=document.getElementById('home-overlay-style');if(!st){st=document.createElement('style');st.id='home-overlay-style';st.textContent=css;document.head.appendChild(st)}var copy=room.querySelector('.library-image-copy');if(!copy){copy=document.createElement('div');copy.className='library-image-copy';copy.setAttribute('aria-hidden','true');room.appendChild(copy)}var sel=document.getElementById('uiLangSelect');var fr=(document.documentElement.lang||'').toLowerCase()==='fr'||(sel&&sel.value==='FR');copy.innerHTML='<span class="image-free">'+(fr?'GRATUIT':'FREE')+'</span><span class="image-hero-title">'+(fr?'Entrez dans votre bibliothèque':'Enter your library')+'</span><span class="image-hero-lead">'+(fr?'Des histoires à découvrir, des livres à feuilleter.':'Stories to discover. Books to explore.')+'</span><span class="image-explore">'+(fr?'Explorer les genres':'Explore genres')+'</span><span class="image-all">'+(fr?'Voir tous les livres':'See all books')+'</span><span class="image-shelf">'+(fr?'À découvrir aujourd’hui':'Discover today')+'</span>';room.querySelectorAll('.library-daily-book').forEach(function(a){var cap=a.querySelector('.library-original-caption');var title=(a.getAttribute('aria-label')||'').split(' — ')[0];if(!cap){cap=document.createElement('span');cap.className='library-original-caption';a.appendChild(cap)}cap.textContent=title});if(sel&&!sel.dataset.overlayBound){sel.dataset.overlayBound='1';sel.addEventListener('change',function(){setTimeout(refresh,50)})}}
            document.addEventListener('DOMContentLoaded',refresh);setInterval(refresh,800);
          })();'''
          (output/'assets/library/home-enhancements.js').write_text(enhancement)
          version=hashlib.sha256(Path('bookclassics-design-assets.zip').read_bytes()).hexdigest()[:12]
          css='<link rel="stylesheet" href="/assets/library/library.css?v='+version+'">\n<link rel="stylesheet" href="/assets/library/cohesion.css?v='+version+'">'
          root=output/'index.html'; html=root.read_text()
          html=re.sub(r'<link[^>]+href="/assets/library/library.css[^" ]*"[^>]*>','',html)
          html=re.sub(r'<script src="/assets/library/[^" ]+"></script>','',html)
          html=html.replace('<header class="site">',css+'\n<header class="site">',1)
          for script in ['library.js','reader-pages.js','cohesion.js','home-enhancements.js']:
            tag='<script src="/assets/library/'+script+'?v='+version+'"></script>'
            if tag not in html: html+=tag+'\n'
          html=html.replace('content="#2D49EC"','content="#14283B"')
          root.write_text(html)
          pages=list((output/'books').glob('*/index.html'))+[output/'books/index.html']
          for page in pages:
            if not page.exists(): continue
            html=page.read_text()
            html=re.sub(r'<link[^>]+href="/assets/library/library.css[^" ]*"[^>]*>','',html)
            html=html.replace('</head>',css+'\n</head>',1)
            html=html.replace('<body>','<body class="standalone-library">')
            page.write_text(html)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy BookClassics
        id: deployment
        uses: actions/deploy-pages@v4
