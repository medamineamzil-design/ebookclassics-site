;left:-2%;right:-2%;top:1%;bottom:9%;z-index:0;border-radius:2px 5px 3px 2px;background:linear-gradient(90deg,rgba(25,16,10,.7),rgba(105,67,35,.25) 8%,rgba(255,255,255,.12) 88%,rgba(20,10,5,.6));box-shadow:0 10px 8px rgba(32,19,10,.5),inset -3px 0 4px rgba(255,255,255,.18)}.library-original-home .library-daily-book img{position:relative;z-index:2;display:block;width:100%!important;height:88%!important;max-height:none!important;aspect-ratio:2/3;object-fit:fill!important;border-radius:2px 3px 2px 2px;box-shadow:-6px 2px 8px rgba(18,11,7,.5),inset 3px 0 5px rgba(255,255,255,.14);clip-path:none!important;transform-origin:50% 100%}.library-original-home .library-daily-book:nth-child(1) img{transform:perspective(900px) rotateY(-4deg)}.library-original-home .library-daily-book:nth-child(2) img{transform:perspective(900px) rotateY(2deg)}.library-original-home .library-daily-book:nth-child(3) img{transform:perspective(900px) rotateY(-1deg)}.library-original-home .library-daily-book:nth-child(4) img{transform:perspective(900px) rotateY(3deg)}.library-original-home .library-daily-book:nth-child(5) img{transform:perspective(900px) rotateY(-3deg)}.library-original-home .library-daily-book::after{content:var(--library-open-label,Open);position:absolute;left:14%;right:14%;bottom:-1.5%;height:10%;z-index:4;display:flex;align-items:center;justify-content:center;border:1px solid rgba(104,69,36,.65);border-radius:6px;background:linear-gradient(#fffaf0,#ead6b8);box-shadow:0 2px 4px rgba(32,19,10,.4);color:#14283b;font:600 clamp(7px,.9vw,14px)/1 Georgia,serif;white-space:nowrap;pointer-events:none}.library-summary{padding-top:22px!important;padding-bottom:32px!important}.library-summary h2{margin-bottom:12px!important}.library-summary p{margin-top:8px!important;font-weight:600}.library-summary p::first-letter{font-weight:700}";
          var labels={fr:['GRATUIT','Entrez dans votre bibliothèque','Des histoires à découvrir, des livres à feuilleter.','Explorer les genres','Voir tous les livres','À découvrir aujourd’hui'],en:['FREE','Enter your library','Stories to discover. Books to explore.','Explore genres','See all books','Discover today'],es:['GRATIS','Entra en tu biblioteca','Historias para descubrir. Libros para explorar.','Explorar géneros','Ver todos los libros','Descubre hoy'],pt:['GRÁTIS','Entre na sua biblioteca','Histórias para descobrir. Livros para explorar.','Explorar gêneros','Ver todos os livros','Descubra hoje'],de:['KOSTENLOS','Betreten Sie Ihre Bibliothek','Geschichten entdecken. Bücher erkunden.','Genres erkunden','Alle Bücher ansehen','Heute entdecken'],it:['GRATIS','Entra nella tua biblioteca','Storie da scoprire. Libri da esplorare.','Esplora i generi','Vedi tutti i libri','Scopri oggi'],ar:['مجانًا','ادخل إلى مكتبتك','قصص لاكتشافها. كتب لاستكشافها.','استكشف الأنواع','عرض كل الكتب','اكتشف اليوم'],ru:['БЕСПЛАТНО','Войдите в свою библиотеку','Истории для открытия. Книги для чтения.','Все жанры','Все книги','Откройте сегодня'],zh:['免费','进入您的图书馆','发现故事，探索书籍。','探索分类','查看全部图书','今日推荐'],hi:['मुफ़्त','अपनी लाइब्रेरी में आएँ','खोजने के लिए कहानियाँ। पढ़ने के लिए किताबें।','शैलियाँ देखें','सभी किताबें देखें','आज खोजें'],ko:['무료','도서관에 오신 것을 환영합니다','발견할 이야기와 책을 만나보세요.','장르 둘러보기','모든 책 보기','오늘의 추천'],tr:['ÜCRETSİZ','Kütüphanenize hoş geldiniz','Keşfedilecek hikâyeler, okunacak kitaplar.','Türleri keşfet','Tüm kitapları gör','Bugün keşfet']};
          function refresh(){var room=document.querySelector('.library-original-home');if(!room)return;var style=document.getElementById('home-overlay-style');if(!style){style=document.createElement('style');style.id='home-overlay-style';style.textContent=css;document.head.appendChild(style)}var layer=room.querySelector('.library-image-copy');if(!layer){layer=document.createElement('div');layer.className='library-image-copy';layer.setAttribute('aria-live','polite');room.appendChild(layer)}var select=document.getElementById('uiLangSelect');var code=((select&&select.value)||document.documentElement.lang||'en').toLowerCase().split('-')[0];var t=labels[code]||labels.en;var openLabel=code==='fr'?'Ouvrir':code==='es'?'Abrir':code==='de'?'Öffnen':code==='it'?'Apri':code==='pt'?'Abrir':code==='ar'?'افتح':'Open';room.style.setProperty('--library-open-label',JSON.stringify(openLabel));layer.innerHTML='<span class="image-free">'+t[0]+'</span><span class="image-hero-title">'+t[1]+'</span><span class="image-hero-lead">'+t[2]+'</span><span class="image-explore">'+t[3]+'</span><span class="image-all">'+t[4]+'</span><span class="image-shelf">'+t[5]+'</span>';room.querySelectorAll('.library-daily-book').forEach(function(a){var cap=a.querySelector('.library-original-caption');var title=(a.getAttribute('aria-label')||'').split(' — ')[0];if(!cap){cap=document.createElement('span');cap.className='library-original-caption';a.appendChild(cap)}cap.textContent=title;cap.setAttribute('translate','no');a.setAttribute('translate','no');var open=a.querySelector('.library-open-label');if(!open){open=document.createElement('span');open.className='library-open-label';a.appendChild(open)}open.textContent=openLabel});room.querySelector('.original-home').textContent=code==='fr'?'Accueil':code==='es'?'Inicio':code==='de'?'Start':code==='ar'?'الرئيسية':'Home';room.querySelector('.original-genres').textContent=t[3];room.querySelector('.original-library').textContent=code==='fr'?'Mes livres':code==='es'?'Mis libros':code==='de'?'Meine Bücher':code==='it'?'I miei libri':code==='pt'?'Meus livros':code==='ar'?'كتبي':'My books';if(select&&!select.dataset.homeOverlayBound){select.dataset.homeOverlayBound='1';select.addEventListener('change',function(){setTimeout(refresh,80)})}}
          function polish(){
