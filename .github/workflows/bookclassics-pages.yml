name: BookClassics library design
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble current catalogue with library design
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, zipfile, hashlib, re
          source=Path('.')
          output=Path('_site'); output.mkdir(exist_ok=True)
          for p in source.iterdir():
            if p.name.startswith('.') or p.name in {'_site','bookclassics-design-assets.zip'}: continue
            if p.is_dir(): shutil.copytree(p,output/p.name,dirs_exist_ok=True)
            else: shutil.copy2(p,output/p.name)
          with zipfile.ZipFile('bookclassics-design-assets.zip') as archive:
            for item in archive.infolist():
              path=Path(item.filename)
              if path.is_absolute() or '..' in path.parts or not item.filename.startswith('assets/library/'): raise ValueError('Unexpected asset path')
            archive.extractall(output)
          version=hashlib.sha256(Path('bookclassics-design-assets.zip').read_bytes()).hexdigest()[:12]
          css='<link rel="stylesheet" href="/assets/library/library.css?v='+version+'">\n<link rel="stylesheet" href="/assets/library/cohesion.css?v='+version+'">'
          root=output/'index.html'; html=root.read_text()
          html=re.sub(r'<link[^>]+href="/assets/library/library.css[^" ]*"[^>]*>','',html)
          html=re.sub(r'<script src="/assets/library/[^" ]+"></script>','',html)
          html=html.replace('<header class="site">',css+'\n<header class="site">',1)
          for script in ['library.js','reader-pages.js','cohesion.js']:
            html += '\n<script src="/assets/library/'+script+'?v='+version+'"></script>\n'
          html=html.replace('content="#2D49EC"','content="#14283B"'); root.write_text(html)
          pages=list((output/'books').glob('*/index.html'))+[output/'books/index.html']
          for page in pages:
            if not page.exists(): continue
            html=page.read_text(); html=re.sub(r'<link[^>]+href="/assets/library/library.css[^" ]*"[^>]*>','',html); html=html.replace('</head>',css+'\n</head>',1); html=html.replace('<body>','<body class="standalone-library">'); page.write_text(html)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy BookClassics
        id: deployment
        uses: actions/deploy-pages@v4
