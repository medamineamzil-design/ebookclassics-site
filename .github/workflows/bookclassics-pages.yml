name: BookClassics library design
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble catalogue and library design
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, zipfile, hashlib, re
          source = Path('.')
          output = Path('_site')
          output.mkdir(exist_ok=True)
          for p in source.iterdir():
              if p.name in {'.git', '.github', '_site', 'bookclassics-design-assets.zip'}:
                  continue
              if p.is_dir():
                  shutil.copytree(p, output / p.name, dirs_exist_ok=True)
              else:
                  shutil.copy2(p, output / p.name)
          with zipfile.ZipFile('bookclassics-design-assets.zip') as archive:
              for item in archive.infolist():
                  path = Path(item.filename)
                  if path.is_absolute() or '..' in path.parts or not item.filename.startswith('assets/library/'):
                      raise ValueError('Unexpected design asset path')
              archive.extractall(output)
          enhancement = r'''(function(){
          var css="\n.library-original-home{position:relative}.library-image-copy{position:absolute;inset:0;pointer-events:none;z-index:5;font-family:Georgia,serif;color:#14283b}.library-image-copy span{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;box-sizing:border-box}\n.image-free{top:18%;left:43%;width:14%;height:4%;background:#f3e8d3;color:#705126;font:700 clamp(8px,1vw,15px) Arial,sans-serif}\n.image-hero-title{top:23.3%;left:30.4%;width:39.2%;height:5.5%;background:#f3e8d3;font-weight:700;font-size:clamp(12px,2.5vw,39px)}\n.image-hero-lead{top:28.7%;left:30.4%;width:39.2%;height:3.7%;background:#f3e8d3;font-size:clamp(7px,1.4vw,22px)}\n.image-explore,.image-all{top:33.2%;height:5.3%;border-radius:5px;font-size:clamp(7px,1.15vw,18px)}.image-explore{left:33.4%;width:16.5%;background:#14283b;color:#fff8ea}.image-all{left:51.3%;width:15.6%;background:#f3e8d3;color:#14283b}\n.image-shelf{top:56.4%;left:41%;width:18%;height:3.7%;background:#573719;color:#ffe1a5;font-size:clamp(9px,1.65vw,25px)}\n.library-original-home .library-art-link.original-home,.library-original-home .library-art-link.original-genres,.library-original-home .library-art-link.original-library{z-index:7;display:flex;align-items:center;justify-content:center;background:#192b3e;color:#fff3dc;font:clamp(6px,1vw,16px)/1.2 Georgia,serif;text-align:center}\n.library-original-caption{display:none!important}.library-open-label{display:none!important}\n.library-account-tools{min-height:0!important;padding:6px 20px!important;gap:10px!important;align-items:center!important}.library-account-tools button,.library-account-tools select{min-height:30px!important;padding:5px 10px!important;margin:0!important}.library-account-tools .lang-switch{margin:0!important}\na:focus:not(:focus-visible),button:focus:not(:focus-visible){outline:none!important;box-shadow:none!important}.library-original-home a:focus:not(:focus-visible){outline:none!important;box-shadow:none!important}\n@media(max-width:600px){.library-original-home{isolation:isolate}.library-image-copy{bottom:auto;aspect-ratio:3/2}.library-original-links,.library-daily-books{bottom:auto;aspect-ratio:3/2}.library-account-tools{justify-content:center!important;gap:5px!important}.library-account-tools button{font-size:12px!important}}\n\n:focus,:focus-visible{outline:none!important;box-shadow:none!important}body[data-library-view=home] header.site{display:contents!important}body[data-library-view=home] .library-account-tools{position:absolute!important;top:1.2%;right:2%;z-index:30;background:transparent!important;color:#fff5df!important}body:not([data-library-view=home]) header.site .catbar{display:none!important}body:not([data-library-view=home]) .library-account-tools{position:absolute!important;top:7px;right:18px;z-index:30;padding:0!important;background:transparent!important}.library-original-home .image-free{display:none!important}.library-original-home .library-daily-books{z-index:8;pointer-events:none}.library-original-home .library-daily-book{top:60.75%!important;height:29.2%!important;display:flex!important;flex-direction:column;align-items:center;justify-content:flex-start;pointer-events:auto;transform-origin:50% 100%;filter:drop-shadow(0 9px 5px rgba(35,21,12,.5))}.library-original-home .library-daily-book:nth-child(1){left:10.9%!important;width:14.1%!important;transform:rotate(-3.8deg)}.library-original-home .library-daily-book:nth-child(2){left:27.6%!important;width:13.6%!important;transform:rotate(1.8deg)}.library-original-home .library-daily-book:nth-child(3){left:43.0%!important;width:14.1%!important;transform:rotate(-1.1deg)}.library-original-home .library-daily-book:nth-child(4){left:58.7%!important;width:13.8%!important;transform:rotate(2.7deg)}.library-original-home .library-daily-book:nth-child(5){left:74.3%!important;width:13.7%!important;transform:rotate(-2.6deg)}.library-original-home .library-daily-book::before{content:"";position:absolute;left:-2%;right:-2%;top:1%;bottom:9%;z-index:0;border-radius:2px 5px 3px 2px;background:linear-gradient(90deg,rgba(25,16,10,.7),rgba(105,67,35,.25) 8%,rgba(255,255,255,.12) 88%,rgba(20,10,5,.6));box-shadow:0 10px 8px rgba(32,19,10,.5),inset -3px 0 4px rgba(255,255,255,.18)}.library-original-home .library-daily-book img{position:relative;z-index:2;display:block;width:100%!important;height:88%!important;max-height:none!important;aspect-ratio:2/3;object-fit:fill!important;border-radius:2px 3px 2px 2px;box-shadow:-6px 2px 8px rgba(18,11,7,.5),inset 3px 0 5px rgba(255,255,255,.14);clip-path:none!important;transform-origin:50% 100%}.library-original-home .library-daily-book:nth-child(1) img{transform:perspective(900px) rotateY(-4deg)}.library-original-home .library-daily-book:nth-child(2) img{transform:perspective(900px) rotateY(2deg)}.library-original-home .library-daily-book:nth-child(3) img{transform:perspective(900px) rotateY(-1deg)}.library-original-home .library-daily-book:nth-child(4) img{transform:perspective(900px) rotateY(3deg)}.library-original-home .library-daily-book:nth-child(5) img{transform:perspective(900px) rotateY(-3deg)}.library-original-home .library-daily-book::after{content:var(--library-open-label,Open);position:absolute;left:14%;right:14%;bottom:-1.5%;height:10%;z-index:4;display:flex;align-items:center;justify-content:center;border:1px solid rgba(104,69,36,.65);border-radius:6px;background:linear-gradient(#fffaf0,#ead6b8);box-shadow:0 2px 4px rgba(32,19,10,.4);color:#14283b;font:600 clamp(7px,.9vw,14px)/1 Georgia,serif;white-space:nowrap;pointer-events:none}.library-summary{padding-top:22px!important;padding-bottom:32px!important}.library-summary h2{margin-bottom:12px!important}.library-summary p{margin-top:8px!important;font-weight:600}.library-summary p::first-letter{font-weight:700}";
          var labels={fr:['GRATUIT','Entrez dans votre bibliothèque','Des histoires à découvrir, des livres à feuilleter.','Explorer les genres','Voir tous les livres','À découvrir aujourd’hui'],en:['FREE','Enter your library','Stories to discover. Books to explore.','Explore genres','See all books','Discover today'],es:['GRATIS','Entra en tu biblioteca','Historias para descubrir. Libros para explorar.','Explorar géneros','Ver todos los libros','Descubre hoy'],pt:['GRÁTIS','Entre na sua biblioteca','Histórias para descobrir. Livros para explorar.','Explorar gêneros','Ver todos os livros','Descubra hoje'],de:['KOSTENLOS','Betreten Sie Ihre Bibliothek','Geschichten entdecken. Bücher erkunden.','Genres erkunden','Alle Bücher ansehen','Heute entdecken'],it:['GRATIS','Entra nella tua biblioteca','Storie da scoprire. Libri da esplorare.','Esplora i generi','Vedi tutti i libri','Scopri oggi'],ar:['مجانًا','ادخل إلى مكتبتك','قصص لاكتشافها. كتب لاستكشافها.','استكشف الأنواع','عرض كل الكتب','اكتشف اليوم'],ru:['БЕСПЛАТНО','Войдите в свою библиотеку','Истории для открытия. Книги для чтения.','Все жанры','Все книги','Откройте сегодня'],zh:['免费','进入您的图书馆','发现故事，探索书籍。','探索分类','查看全部图书','今日推荐'],hi:['मुफ़्त','अपनी लाइब्रेरी में आएँ','खोजने के लिए कहानियाँ। पढ़ने के लिए किताबें।','शैलियाँ देखें','सभी किताबें देखें','आज खोजें'],ko:['무료','도서관에 오신 것을 환영합니다','발견할 이야기와 책을 만나보세요.','장르 둘러보기','모든 책 보기','오늘의 추천'],tr:['ÜCRETSİZ','Kütüphanenize hoş geldiniz','Keşfedilecek hikâyeler, okunacak kitaplar.','Türleri keşfet','Tüm kitapları gör','Bugün keşfet']};
          function refresh(){var room=document.querySelector('.library-original-home');if(!room)return;var style=document.getElementById('home-overlay-style');if(!style){style=document.createElement('style');style.id='home-overlay-style';style.textContent=css;document.head.appendChild(style)}var layer=room.querySelector('.library-image-copy');if(!layer){layer=document.createElement('div');layer.className='library-image-copy';layer.setAttribute('aria-live','polite');room.appendChild(layer)}var select=document.getElementById('uiLangSelect');var code=((select&&select.value)||document.documentElement.lang||'en').toLowerCase().split('-')[0];var t=labels[code]||labels.en;var openLabel=code==='fr'?'Ouvrir':code==='es'?'Abrir':code==='de'?'Öffnen':code==='it'?'Apri':code==='pt'?'Abrir':code==='ar'?'افتح':'Open';room.style.setProperty('--library-open-label',JSON.stringify(openLabel));layer.innerHTML='<span class="image-free">'+t[0]+'</span><span class="image-hero-title">'+t[1]+'</span><span class="image-hero-lead">'+t[2]+'</span><span class="image-explore">'+t[3]+'</span><span class="image-all">'+t[4]+'</span><span class="image-shelf">'+t[5]+'</span>';room.querySelectorAll('.library-daily-book').forEach(function(a){var cap=a.querySelector('.library-original-caption');var title=(a.getAttribute('aria-label')||'').split(' — ')[0];if(!cap){cap=document.createElement('span');cap.className='library-original-caption';a.appendChild(cap)}cap.textContent=title;cap.setAttribute('translate','no');a.setAttribute('translate','no');var open=a.querySelector('.library-open-label');if(!open){open=document.createElement('span');open.className='library-open-label';a.appendChild(open)}open.textContent=openLabel});room.querySelector('.original-home').textContent=code==='fr'?'Accueil':code==='es'?'Inicio':code==='de'?'Start':code==='ar'?'الرئيسية':'Home';room.querySelector('.original-genres').textContent=t[3];room.querySelector('.original-library').textContent=code==='fr'?'Mes livres':code==='es'?'Mis libros':code==='de'?'Meine Bücher':code==='it'?'I miei libri':code==='pt'?'Meus livros':code==='ar'?'كتبي':'My books';if(select&&!select.dataset.homeOverlayBound){select.dataset.homeOverlayBound='1';select.addEventListener('change',function(){setTimeout(refresh,80)})}}
          function polish(){
          var root=document.documentElement,code=((document.getElementById('uiLangSelect')||{}).value||root.lang||'en').toLowerCase().split('-')[0];
          var fr=code==='fr', es=code==='es', de=code==='de', it=code==='it', pt=code==='pt', ar=code==='ar';
          var summary=document.querySelector('.library-summary'); if(summary){var h=summary.querySelector('h2');if(h)h.textContent=fr?'La bibliothèque en quelques chiffres':es?'Tu biblioteca de un vistazo':de?'Ihre Bibliothek auf einen Blick':it?'La tua biblioteca in sintesi':pt?'A sua biblioteca em números':ar?'لمحة عن مكتبتك':'Your library at a glance';var p=summary.querySelector('p');if(p)p.textContent=fr?'GRATUIT · Des classiques à lire, à écouter et à retrouver chaque jour.':es?'GRATIS · Clásicos para leer, escuchar y redescubrir cada día.':de?'KOSTENLOS · Klassiker zum Lesen, Hören und täglichen Wiederentdecken.':it?'GRATIS · Classici da leggere, ascoltare e riscoprire ogni giorno.':pt?'GRÁTIS · Clássicos para ler, ouvir e redescobrir todos os dias.':ar?'مجانًا · كلاسيكيات للقراءة والاستماع وإعادة الاكتشاف كل يوم.':'FREE · Classic stories to read, listen to and rediscover every day.';}
          document.querySelectorAll('.library-original-caption,.library-open-label').forEach(function(n){n.remove()});
          var free=document.querySelector('.image-free');if(free)free.remove();
          }
          refresh();polish();document.addEventListener('change',function(e){if(e.target&&e.target.id==='uiLangSelect'){setTimeout(function(){refresh();polish()},80)}});setInterval(function(){refresh();polish()},1200);
          })();'''
          (output / 'assets/library/home-enhancements.js').write_text(enhancement)
          version = hashlib.sha256(Path('bookclassics-design-assets.zip').read_bytes() + enhancement.encode() + b'fragment-safe-v2').hexdigest()[:12]
          css = '<link rel="stylesheet" href="/assets/library/library.css?v=' + version + '">\n<link rel="stylesheet" href="/assets/library/cohesion.css?v=' + version + '">' 
          root = output / 'index.html'
          html = root.read_text()
          html = re.sub(r'<link[^>]+href="/assets/library/library.css[^" ]*"[^>]*>', '', html)
          html = re.sub(r'<script src="/assets/library/[^" ]+"></script>', '', html)
          html = html.replace('<header', css + '\n<header', 1)
          scripts = ''.join('<script src="/assets/library/' + name + '?v=' + version + '"></script>\n' for name in ['library.js', 'reader-pages.js', 'cohesion.js', 'home-enhancements.js'])
          # The source is an HTML fragment; its closing body tags belong to book templates.
          html += '\n' + scripts
          html = html.replace('content="#2D49EC"', 'content="#14283B"')
          root.write_text(html)
          pages = list((output / 'books').glob('*/index.html')) + [output / 'books/index.html']
          for page in pages:
              if not page.exists():
                  continue
              html = page.read_text()
              html = re.sub(r'<link[^>]+href="/assets/library/library.css[^" ]*"[^>]*>', '', html)
              html = html.replace('</head>', css + '\n</head>', 1)
              html = html.replace('<body>', '<body class="standalone-library">')
              page.write_text(html)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy BookClassics
        id: deployment
        uses: actions/deploy-pages@v4
